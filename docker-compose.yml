services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: ${DB_NAME:-session_management_e2e}
      MYSQL_USER: ${DB_USER:-session_api_local}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the local MySQL instance}
    ports:
      - '127.0.0.1:${DB_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
